name: Java CI with Gradle

on:
  push:
    branches: [ "cicd/3" ]

permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean bootJar

      - name: Docker image build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/monitor-container .

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/monitor-container

  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Docker pull
        run: sudo docker pull ${{ secrets.DOCKER_USERNAME }}/monitor-container

      - name: Create .env file
        run: echo "${{ secrets.APPLICATION_B64 }}" > .env

      - name: Generate self-signed SSL certs (if not exist)
        run: |
          if [ ! -f /etc/nginx/certs/fullchain.pem ]; then
            sudo mkdir -p /etc/nginx/certs
            sudo openssl req -x509 -nodes -days 365 \
              -newkey rsa:2048 \
              -keyout /etc/nginx/certs/privkey.pem \
              -out /etc/nginx/certs/fullchain.pem \
              -subj "/C=KR/ST=Seoul/L=Seoul/O=Budong/CN=localhost"
            echo "SSL 인증서 생성 완료"
          else
            echo "SSL 인증서가 이미 존재합니다. 건너뜁니다."
          fi

      - name: Docker Compose Down
        run: sudo docker-compose -p monitor down --remove-orphans

      - name: Docker Compose Up
        run: sudo docker-compose -p monitor up -d